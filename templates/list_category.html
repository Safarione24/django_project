{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}



    <h2>Список категорий</h2>
    <a href="{% url 'index' %}">← На главную</a>
    <ul>
        {% for category in categories %}

    
            <li>
                {{ category.name }}
                <div>
                    <a href="{% url 'detail_category' category.pk %}">Подробнее</a>
                    <a href="{% url 'update_category' category.pk %}">Обновить</a>
                    <a href="{% url 'delete_category' category.pk %}">Удалить</a>
                </div>
            </li>
        {% empty %}
            <li>Нет категорий</li>
        {% endfor %}
    </ul>
{% endblock %}
